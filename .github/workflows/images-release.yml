name: Mesh LLM Packaging Release

on:
  repository_dispatch:
    types: [mesh-llm-release]
  workflow_dispatch:
    inputs:
      mesh_repository:
        description: Upstream release repository
        required: true
        default: Mesh-LLM/mesh-llm
        type: string
      mesh_ref:
        description: Published upstream release tag (for example v0.73.1)
        required: true
        type: string
      mesh_version:
        description: Release version (for example 0.73.1)
        required: true
        type: string
      dry_run:
        description: Build and test everything without publishing
        required: true
        default: true
        type: boolean
      publish_images:
        description: Publish OCI images to GHCR
        required: true
        default: false
        type: boolean
      publish_release_assets:
        description: Publish native packages, SBOMs, checksums, and formula to this repository release
        required: true
        default: false
        type: boolean
      publish_npm:
        description: Publish the assembled Node SDK package to npm
        required: true
        default: false
        type: boolean
      variant_filter:
        description: Optional comma-separated variant or artifact IDs
        required: false
        default: ''
        type: string
      platform_filter:
        description: Optional comma-separated platform or architecture values
        required: false
        default: ''
        type: string
      npm_lane_filter:
        description: Optional comma-separated Node SDK lane IDs or targets
        required: false
        default: ''
        type: string

concurrency:
  group: mesh-llm-packaging-${{ github.event.client_payload.ref || inputs.mesh_ref || github.ref }}-${{ inputs.dry_run || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/mesh-llm/mesh-llm' }}

jobs:
  plan:
    name: Resolve immutable upstream release and matrices
    runs-on: ubuntu-24.04
    outputs:
      package_matrix: ${{ steps.matrix.outputs.package_matrix }}
      upstream_matrix: ${{ steps.matrix.outputs.upstream_matrix }}
      homebrew_plan: ${{ steps.matrix.outputs.homebrew_plan }}
      npm_matrix: ${{ steps.matrix.outputs.npm_matrix }}
      npm_plan: ${{ steps.matrix.outputs.npm_plan }}
      # Manual runs validate npm by default; automated handoffs build npm only when publishing.
      npm_enabled: ${{ steps.matrix.outputs.npm_enabled == 'true' && (github.event_name == 'workflow_dispatch' || steps.meta.outputs.publish_npm == 'true') }}
      mesh_repository: ${{ steps.meta.outputs.mesh_repository }}
      mesh_ref: ${{ steps.meta.outputs.mesh_ref }}
      mesh_sha: ${{ steps.meta.outputs.mesh_sha }}
      mesh_version: ${{ steps.meta.outputs.mesh_version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      publish_images: ${{ steps.meta.outputs.publish_images }}
      publish_release_assets: ${{ steps.meta.outputs.publish_release_assets }}
      publish_npm: ${{ steps.meta.outputs.publish_npm }}
      release_assembly_enabled: ${{ steps.meta.outputs.release_assembly_enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          DISPATCH_PUBLISH_IMAGES: ${{ github.event.client_payload.publish_images }}
          DISPATCH_PUBLISH_RELEASE_ASSETS: ${{ github.event.client_payload.publish_release_assets }}
          DISPATCH_PUBLISH_NPM: ${{ github.event.client_payload.publish_npm }}
          INPUT_REPOSITORY: ${{ inputs.mesh_repository }}
          INPUT_REF: ${{ inputs.mesh_ref }}
          INPUT_VERSION: ${{ inputs.mesh_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISH_IMAGES: ${{ inputs.publish_images }}
          INPUT_PUBLISH_RELEASE_ASSETS: ${{ inputs.publish_release_assets }}
          INPUT_PUBLISH_NPM: ${{ inputs.publish_npm }}
          VARIANT_FILTER: ${{ inputs.variant_filter || '' }}
          PLATFORM_FILTER: ${{ inputs.platform_filter || '' }}
          NPM_LANE_FILTER: ${{ inputs.npm_lane_filter || '' }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${DISPATCH_REPOSITORY:-${INPUT_REPOSITORY:-Mesh-LLM/mesh-llm}}"
          ref="${DISPATCH_REF:-${INPUT_REF:-}}"
          version="${DISPATCH_VERSION:-${INPUT_VERSION:-}}"
          dry_run="${DISPATCH_DRY_RUN:-${INPUT_DRY_RUN:-true}}"
          publish_images="${DISPATCH_PUBLISH_IMAGES:-${INPUT_PUBLISH_IMAGES:-false}}"
          publish_release_assets="${DISPATCH_PUBLISH_RELEASE_ASSETS:-${INPUT_PUBLISH_RELEASE_ASSETS:-false}}"
          publish_npm="${DISPATCH_PUBLISH_NPM:-${INPUT_PUBLISH_NPM:-false}}"

          [[ "$repository" == "Mesh-LLM/mesh-llm" ]] || { echo "only Mesh-LLM/mesh-llm is accepted" >&2; exit 1; }
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "mesh_ref must be a release tag" >&2; exit 1; }
          [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "mesh_version must be semver" >&2; exit 1; }
          version="${version#v}"
          [[ "$ref" == "v$version" ]] || { echo "mesh_ref and mesh_version disagree" >&2; exit 1; }
          [[ "$dry_run" == true || "$dry_run" == false ]] || { echo "dry_run must be boolean" >&2; exit 1; }
          [[ "$publish_images" == true || "$publish_images" == false ]] || { echo "publish_images must be boolean" >&2; exit 1; }
          [[ "$publish_release_assets" == true || "$publish_release_assets" == false ]] || { echo "publish_release_assets must be boolean" >&2; exit 1; }
          [[ "$publish_npm" == true || "$publish_npm" == false ]] || { echo "publish_npm must be boolean" >&2; exit 1; }
          if [[ "$dry_run" == true ]]; then
            publish_images=false
            publish_release_assets=false
            publish_npm=false
          fi
          if [[ "$publish_images" == true || "$publish_release_assets" == true || "$publish_npm" == true ]]; then
            if [[ -n "$VARIANT_FILTER" || -n "$PLATFORM_FILTER" || -n "$NPM_LANE_FILTER" ]]; then
              echo "filtered workflow runs may validate but must never publish" >&2
              exit 1
            fi
          fi
          release_assembly_enabled=true
          if [[ -n "$VARIANT_FILTER" || -n "$PLATFORM_FILTER" ]]; then release_assembly_enabled=false; fi

          release_json="$(gh api "repos/$repository/releases/tags/$ref")"
          [[ "$(jq -r .draft <<<"$release_json")" == false ]] || { echo "upstream release is still a draft" >&2; exit 1; }
          mesh_sha="$(git ls-remote "https://github.com/$repository.git" "refs/tags/$ref^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$mesh_sha" ]]; then
            mesh_sha="$(git ls-remote "https://github.com/$repository.git" "refs/tags/$ref" | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$mesh_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve immutable upstream tag SHA" >&2; exit 1; }

          {
            echo "mesh_repository=$repository"
            echo "mesh_ref=$ref"
            echo "mesh_sha=$mesh_sha"
            echo "mesh_version=$version"
            echo "dry_run=$dry_run"
            echo "publish_images=$publish_images"
            echo "publish_release_assets=$publish_release_assets"
            echo "publish_npm=$publish_npm"
            echo "release_assembly_enabled=$release_assembly_enabled"
          } >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          VERSION: ${{ steps.meta.outputs.mesh_version }}
          REF: ${{ steps.meta.outputs.mesh_ref }}
          REPOSITORY: ${{ steps.meta.outputs.mesh_repository }}
          VARIANT_FILTER: ${{ inputs.variant_filter || '' }}
          PLATFORM_FILTER: ${{ inputs.platform_filter || '' }}
          NPM_LANE_FILTER: ${{ inputs.npm_lane_filter || '' }}
        shell: bash
        run: |
          set -euo pipefail
          common=(--version "$VERSION" --mesh-ref "$REF" --mesh-repository "$REPOSITORY" --image "$IMAGE_NAME")
          if [[ -n "$VARIANT_FILTER" ]]; then common+=(--variant-filter "$VARIANT_FILTER"); fi
          if [[ -n "$PLATFORM_FILTER" ]]; then common+=(--platform-filter "$PLATFORM_FILTER"); fi
          package_matrix="$(node --experimental-strip-types scripts/image-matrix.ts github-matrix "${common[@]}")"
          upstream_matrix="$(node --experimental-strip-types scripts/image-matrix.ts upstream-matrix "${common[@]}")"
          homebrew_plan="$(node --experimental-strip-types scripts/image-matrix.ts homebrew-plan --version "$VERSION")"
          npm_args=(--version "$VERSION")
          if [[ -n "$NPM_LANE_FILTER" ]]; then npm_args+=(--lane-filter "$NPM_LANE_FILTER"); fi
          npm_matrix="$(node --experimental-strip-types scripts/image-matrix.ts npm-matrix "${npm_args[@]}")"
          npm_plan="$(node --experimental-strip-types scripts/image-matrix.ts npm-plan "${npm_args[@]}")"
          {
            echo "package_matrix=$package_matrix"
            echo "upstream_matrix=$upstream_matrix"
            echo "homebrew_plan=$homebrew_plan"
            echo "npm_matrix=$npm_matrix"
            echo "npm_plan=$npm_plan"
            echo "npm_enabled=$(jq -r .enabled <<<"$npm_plan")"
          } >> "$GITHUB_OUTPUT"
      - name: Verify producer product-v2 schema
        env:
          MESH_SHA: ${{ steps.meta.outputs.mesh_sha }}
        shell: bash
        run: |
          set -euo pipefail
          producer_schema="artifacts/producer-product-v2.schema.json"
          mkdir -p artifacts
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$producer_schema" \
            "https://raw.githubusercontent.com/Mesh-LLM/mesh-llm/${MESH_SHA}/schemas/product-v2.schema.json"
          node --experimental-strip-types scripts/verify-product-schema.ts \
            --producer-schema "$producer_schema" \
            --consumer-schema schemas/product-v2.schema.json

  upstream:
    name: Verify upstream ${{ matrix.upstream_asset_name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.upstream_matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download archive and checksum sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads artifacts/upstream
          curl --fail --location --retry 3 --output "downloads/${{ matrix.upstream_asset_name }}" "${{ matrix.upstream_asset_url }}"
          curl --fail --location --retry 3 --output "downloads/${{ matrix.upstream_checksum_name }}" "${{ matrix.upstream_checksum_url }}"
          node --experimental-strip-types scripts/upstream-archive.ts \
            --archive "downloads/${{ matrix.upstream_asset_name }}" \
            --checksum "downloads/${{ matrix.upstream_checksum_name }}" \
            --output-dir artifacts/upstream \
            --source-url "${{ matrix.upstream_asset_url }}" \
            --version "${{ matrix.mesh_version }}" \
            --flavor "${{ matrix.upstream_flavor }}"
          mkdir -p artifacts/provenance
          jq --arg arch "${{ matrix.arch }}" --arg platform "${{ matrix.platform }}" \
            '. + {arch: $arch, platform: $platform}' \
            artifacts/upstream/upstream-provenance.json \
            > "artifacts/provenance/${{ matrix.upstream_artifact_id }}.json"
          file artifacts/upstream/mesh-llm | grep -q 'ELF.*executable'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.upstream_artifact_id }}
          path: artifacts/upstream
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-llm-upstream-provenance-${{ matrix.upstream_artifact_id }}
          path: artifacts/provenance/${{ matrix.upstream_artifact_id }}.json
          if-no-files-found: error
          retention-days: 14

  upstream-host-invariant:
    name: Verify one immutable host per platform and architecture
    needs: [plan, upstream]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: mesh-llm-upstream-provenance-*
          path: artifacts/upstream-provenance
          merge-multiple: true
      - name: Reject backend products with different verified host bytes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t provenance_files < <(find artifacts/upstream-provenance -type f -name '*.json' -print0 | sort -z)
          (( ${#provenance_files[@]} > 0 )) || { echo "no upstream provenance records downloaded" >&2; exit 1; }
          node --experimental-strip-types scripts/verify-host-invariant.ts "${provenance_files[@]}"

  native-package:
    name: Package ${{ matrix.artifact_id }}
    needs: [plan, upstream, upstream-host-invariant]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.upstream_artifact_id }}
          path: artifacts/upstream
      - uses: docker/setup-buildx-action@v4
      - name: Build native package from verified upstream product bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: native-package-artifact
          platforms: ${{ matrix.platform }}
          build-args: |
            PACKAGE_BASE_IMAGE=${{ matrix.package_base_image }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            TARGET_ARCH=${{ matrix.arch }}
            MESH_LLM_VERSION=${{ matrix.mesh_version }}
          outputs: type=local,dest=artifacts/native-package
          cache-from: type=gha,scope=package-${{ matrix.artifact_id }}
          cache-to: type=gha,mode=max,scope=package-${{ matrix.artifact_id }}
      - name: Namespace and require BuildKit package provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/native-package/provenance.json
          mv artifacts/native-package/provenance.json \
            "artifacts/native-package/${{ matrix.artifact_id }}.buildkit-provenance.json"
      - name: Verify and install package
        shell: bash
        run: |
          scripts/native-package-qa.sh \
            --distro "${{ matrix.distro }}" \
            --backend "${{ matrix.backend }}" \
            --backend-version "${{ matrix.backend_version }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ matrix.mesh_version }}" \
            --package-format "${{ matrix.package_format }}" \
            --package-dir artifacts/native-package \
            --runtime-base-image "${{ matrix.runtime_base_image }}" \
            --install
      - name: Attach exact upstream provenance to package artifact
        run: cp artifacts/upstream/upstream-provenance.json "artifacts/native-package/${{ matrix.artifact_id }}.upstream-provenance.json"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: artifacts/native-package/${{ matrix.package_file }}
          format: spdx-json
          output-file: artifacts/native-package/${{ matrix.artifact_id }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Verify exact package SBOM subject
        run: |
          node --experimental-strip-types scripts/verify-sbom-subject.ts \
            --package "artifacts/native-package/${{ matrix.package_file }}" \
            --sidecar "artifacts/native-package/${{ matrix.package_file }}.sha256" \
            --sbom "artifacts/native-package/${{ matrix.artifact_id }}.spdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: artifacts/native-package
          if-no-files-found: error
          retention-days: 14

  runtime-image:
    name: Runtime image ${{ matrix.artifact_id }}
    needs: [plan, native-package]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: artifacts/native-package
      - uses: docker/setup-buildx-action@v4
      - name: Read immutable product inputs
        id: product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t provenance_files < <(find artifacts/native-package -name '*.upstream-provenance.json' -type f -print0)
          if (( ${#provenance_files[@]} != 1 )); then
            echo "expected exactly one upstream provenance file, found ${#provenance_files[@]}" >&2
            exit 1
          fi
          provenance="${provenance_files[0]}"
          jq -e '
            (.host_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.runtime_id | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.runtime_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$provenance" >/dev/null
          {
            echo "host_sha=$(jq -r .host_sha256 "$provenance")"
            echo "runtime_id=$(jq -r .runtime_id "$provenance")"
            echo "runtime_sha=$(jq -r .runtime_sha256 "$provenance")"
          } >> "$GITHUB_OUTPUT"
      - name: Build and QA package-installed runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: runtime-qa
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          build-args: |
            RUNTIME_BASE_IMAGE=${{ matrix.runtime_base_image }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            MESH_LLM_VERSION=${{ matrix.mesh_version }}
            MESH_LLM_REF=${{ needs.plan.outputs.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.plan.outputs.mesh_sha }}
            MESH_LLM_HOST_SHA=${{ steps.product.outputs.host_sha }}
            MESH_LLM_RUNTIME_ID=${{ steps.product.outputs.runtime_id }}
            MESH_LLM_RUNTIME_SHA=${{ steps.product.outputs.runtime_sha }}

  homebrew:
    name: Verify Homebrew formula from upstream macOS archive
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.homebrew_plan).runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download, verify, and render formula
        env:
          PLAN: ${{ needs.plan.outputs.homebrew_plan }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$(jq -r .upstream_asset_name <<<"$PLAN")"
          checksum="$(jq -r .upstream_checksum_name <<<"$PLAN")"
          asset_url="$(jq -r .upstream_asset_url <<<"$PLAN")"
          checksum_url="$(jq -r .upstream_checksum_url <<<"$PLAN")"
          curl --fail --location --retry 3 --output "$asset" "$asset_url"
          curl --fail --location --retry 3 --output "$checksum" "$checksum_url"
          node --experimental-strip-types scripts/upstream-archive.ts --archive "$asset" --checksum "$checksum" --output-dir verified --source-url "$asset_url" --version "${{ needs.plan.outputs.mesh_version }}" --flavor metal
          digest="$(jq -r .sha256 verified/upstream-provenance.json)"
          node --experimental-strip-types scripts/homebrew-release.ts --version "${{ needs.plan.outputs.mesh_version }}" --sha256 "$digest" --formula-output artifacts/homebrew/Formula/mesh-llm.rb
          # The hosted image currently carries an unrelated untrusted AWS tap.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew tap-new mesh-llm/packaging-validation
          tap_formula="$(brew --repository)/Library/Taps/mesh-llm/homebrew-packaging-validation/Formula/mesh-llm.rb"
          cp artifacts/homebrew/Formula/mesh-llm.rb "$tap_formula"
          brew audit --strict --online mesh-llm/packaging-validation/mesh-llm
          brew install --formula mesh-llm/packaging-validation/mesh-llm
          brew test mesh-llm/packaging-validation/mesh-llm
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-llm-homebrew-${{ needs.plan.outputs.mesh_version }}
          path: artifacts/homebrew
          if-no-files-found: error
          retention-days: 14

  node-sdk-addon:
    name: Build Node SDK addon ${{ matrix.name }}
    if: needs.plan.outputs.npm_enabled == 'true'
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.npm_matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    env:
      LLAMA_STAGE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.mesh_repository }}
          ref: ${{ needs.plan.outputs.mesh_sha }}
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libssl-dev libdbus-1-dev curl lld
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja lld
      - name: Configure and validate macOS x64 linker
        if: matrix.target == 'darwin-x64'
        working-directory: upstream-source
        shell: bash
        run: |
          set -euo pipefail
          lld_bin="$(brew --prefix lld)/bin"
          test -x "$lld_bin/ld64.lld"
          export PATH="$lld_bin:$PATH"
          export CARGO_ENCODED_RUSTFLAGS='-Clink-arg=-fuse-ld=lld'
          echo "$lld_bin" >> "$GITHUB_PATH"
          echo "CARGO_ENCODED_RUSTFLAGS=$CARGO_ENCODED_RUSTFLAGS" >> "$GITHUB_ENV"

          probe="$RUNNER_TEMP/mesh-cargo-linker-check"
          mkdir -p "$probe/src"
          printf '[package]\nname = "mesh-cargo-linker-check"\nversion = "0.0.0"\nedition = "2024"\n' > "$probe/Cargo.toml"
          printf 'fn main() {}\n' > "$probe/src/main.rs"
          cargo rustc --quiet --manifest-path "$probe/Cargo.toml" --target x86_64-apple-darwin
      - name: Test Node SDK JavaScript
        run: npm test --prefix upstream-source/sdk/node
      - name: Build Node SDK addon
        run: npm run build:native --prefix upstream-source/sdk/node
      - name: Pack, fresh-install, and start Node SDK addon
        timeout-minutes: 3
        shell: bash
        env:
          MESH_VERSION: ${{ needs.plan.outputs.mesh_version }}
          NODE_SDK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          mkdir -p "$smoke_root/tarball" "$smoke_root/consumer"
          (
            cd upstream-source/sdk/node
            npm pack --pack-destination "$smoke_root/tarball"
          )
          tarball="$(find "$smoke_root/tarball" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          (
            cd "$smoke_root/consumer"
            npm init --yes >/dev/null
            npm install "$tarball"
          )
          node scripts/node-sdk-runtime-smoke.cjs \
            --package-root "$smoke_root/consumer" \
            --expected-version "$MESH_VERSION" \
            --target "$NODE_SDK_TARGET"
      - name: Stage Node SDK addon
        shell: bash
        env:
          NODE_SDK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source="upstream-source/sdk/node/native/$NODE_SDK_TARGET/mesh_llm_nodejs.node"
          test -s "$source"
          destination="artifacts/node-sdk-addons/$NODE_SDK_TARGET"
          mkdir -p "$destination"
          cp "$source" "$destination/mesh_llm_nodejs.node"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/node-sdk-addons
          if-no-files-found: error
          retention-days: 14

  node-sdk-preflight:
    name: Assemble and install-test Node SDK npm package
    if: always() && needs.plan.outputs.npm_enabled == 'true' && needs.node-sdk-addon.result == 'success'
    needs: [plan, node-sdk-addon]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.mesh_repository }}
          ref: ${{ needs.plan.outputs.mesh_sha }}
          path: upstream-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download Node SDK addons
        uses: actions/download-artifact@v8
        with:
          pattern: mesh-llm-node-sdk-addon-${{ needs.plan.outputs.mesh_version }}-*
          path: artifacts/node-sdk-addons
          merge-multiple: true
      - name: Verify tagged Node SDK console assets
        working-directory: upstream-source
        run: scripts/verify-sdk-console-assets.sh --sdk node
      - name: Assemble Node SDK package
        env:
          NPM_PLAN: ${{ needs.plan.outputs.npm_plan }}
          MESH_VERSION: ${{ needs.plan.outputs.mesh_version }}
        shell: bash
        run: |
          set -euo pipefail
          targets="$(jq -r '.targets | join(",")' <<<"$NPM_PLAN")"
          node --experimental-strip-types scripts/node-sdk-package.ts \
            --source-root upstream-source \
            --addon-root artifacts/node-sdk-addons \
            --output-dir artifacts/node-sdk-package \
            --expected-version "$MESH_VERSION" \
            --targets "$targets"
      - name: Test, pack, install, and dry-run publish
        timeout-minutes: 5
        env:
          NPM_PLAN: ${{ needs.plan.outputs.npm_plan }}
          MESH_VERSION: ${{ needs.plan.outputs.mesh_version }}
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix artifacts/node-sdk-package
          mkdir -p artifacts/npm consumer
          (
            cd artifacts/node-sdk-package
            npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          )
          tarball="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          if npm view "@mesh-llm/sdk@$MESH_VERSION" version >/dev/null 2>&1; then
            echo "@mesh-llm/sdk@$MESH_VERSION is already published; skipping publish dry-run"
          else
            npm publish "./$tarball" --dry-run --access public --provenance=false
          fi
          (
            cd consumer
            npm init --yes >/dev/null
            npm install "../$tarball"
            if jq -e '.targets | index("linux-x64")' <<<"$NPM_PLAN" >/dev/null; then
              node "$GITHUB_WORKSPACE/scripts/node-sdk-runtime-smoke.cjs" \
                --package-root "$PWD" \
                --expected-version "$MESH_VERSION" \
                --target linux-x64-assembled-package
            fi
          )
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-llm-node-sdk-npm-${{ needs.plan.outputs.mesh_version }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-node-sdk:
    name: Publish Node SDK to npm
    if: always() && needs.plan.outputs.publish_npm == 'true' && needs.node-sdk-preflight.result == 'success'
    needs: [plan, node-sdk-preflight]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v8
        with:
          name: mesh-llm-node-sdk-npm-${{ needs.plan.outputs.mesh_version }}
          path: artifacts/npm
      - name: Publish Node SDK package
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.mesh_version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@mesh-llm/sdk@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@mesh-llm/sdk@$RELEASE_VERSION is already published"
            exit 0
          fi
          dist_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; fi
          tarball="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm publish "./$tarball" --access public --tag "$dist_tag" --provenance

  publish-images:
    name: Publish image ${{ matrix.artifact_id }}
    if: needs.plan.outputs.publish_images == 'true'
    needs: [plan, runtime-image]
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: artifacts/native-package
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read immutable product inputs
        id: product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t provenance_files < <(find artifacts/native-package -name '*.upstream-provenance.json' -type f -print0)
          if (( ${#provenance_files[@]} != 1 )); then
            echo "expected exactly one upstream provenance file, found ${#provenance_files[@]}" >&2
            exit 1
          fi
          provenance="${provenance_files[0]}"
          jq -e '
            (.host_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.runtime_id | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.runtime_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$provenance" >/dev/null
          {
            echo "host_sha=$(jq -r .host_sha256 "$provenance")"
            echo "runtime_id=$(jq -r .runtime_id "$provenance")"
            echo "runtime_sha=$(jq -r .runtime_sha256 "$provenance")"
          } >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ matrix.tags }}
          build-args: |
            RUNTIME_BASE_IMAGE=${{ matrix.runtime_base_image }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            MESH_LLM_VERSION=${{ matrix.mesh_version }}
            MESH_LLM_REF=${{ needs.plan.outputs.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.plan.outputs.mesh_sha }}
            MESH_LLM_HOST_SHA=${{ steps.product.outputs.host_sha }}
            MESH_LLM_RUNTIME_ID=${{ steps.product.outputs.runtime_id }}
            MESH_LLM_RUNTIME_SHA=${{ steps.product.outputs.runtime_sha }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-assembly:
    name: Assemble immutable native package release evidence
    if: needs.plan.outputs.release_assembly_enabled == 'true'
    needs: [plan, native-package, homebrew]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: mesh-llm-package-*
          path: release-assets/native
      - uses: actions/download-artifact@v8
        with:
          name: mesh-llm-homebrew-${{ needs.plan.outputs.mesh_version }}
          path: release-assets/homebrew
      - name: Assemble and verify the exact 11-package release
        env:
          PACKAGE_MATRIX: ${{ needs.plan.outputs.package_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PACKAGE_MATRIX" > package-matrix.json
          node --experimental-strip-types scripts/release-evidence.ts assemble \
            --input release-assets/native \
            --homebrew release-assets/homebrew \
            --matrix package-matrix.json \
            --output release-upload \
            --metadata release-metadata \
            --version "${{ needs.plan.outputs.mesh_version }}" \
            --mesh-ref "${{ needs.plan.outputs.mesh_ref }}" \
            --mesh-sha "${{ needs.plan.outputs.mesh_sha }}" \
            --packaging-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: mesh-llm-release-assembly-${{ needs.plan.outputs.mesh_version }}
          path: |
            release-upload
            release-metadata
            package-matrix.json
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    name: Publish immutable native package release assets
    if: needs.plan.outputs.publish_release_assets == 'true'
    needs: [plan, release-assembly]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: mesh-llm-release-assembly-${{ needs.plan.outputs.mesh_version }}
          path: assembled
      - name: Re-verify assembled release evidence
        run: |
          node --experimental-strip-types scripts/release-evidence.ts verify \
            --output assembled/release-upload \
            --matrix assembled/package-matrix.json \
            --version "${{ needs.plan.outputs.mesh_version }}" \
            --mesh-ref "${{ needs.plan.outputs.mesh_ref }}" \
            --mesh-sha "${{ needs.plan.outputs.mesh_sha }}" \
            --packaging-sha "$GITHUB_SHA"
      - name: Fail closed or select immutable create
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: packaging-v${{ needs.plan.outputs.mesh_version }}
          TITLE: mesh-llm ${{ needs.plan.outputs.mesh_version }} packages
          BODY: Packages derived from verified Mesh-LLM/mesh-llm ${{ needs.plan.outputs.mesh_ref }} at ${{ needs.plan.outputs.mesh_sha }}.
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > release-body.md
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          status="$(curl --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output existing-release.json \
            --write-out '%{http_code}' \
            "$api_url")"
          if [[ "$status" == 200 ]]; then
            release_id="$(jq -er .id existing-release.json)"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              | jq 'add' > existing-assets.json
            tag_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
            fi
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || {
              echo "existing release tag resolves to $tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            }
            node --experimental-strip-types scripts/release-evidence.ts compare-release \
              --release existing-release.json \
              --assets existing-assets.json \
              --output assembled/release-upload \
              --tag "$TAG" \
              --title "$TITLE" \
              --body-file release-body.md \
              --target-sha "$GITHUB_SHA"
            echo "mode=noop" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 404 ]]; then
            echo "mode=create" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release lookup failed with HTTP $status" >&2
            jq . existing-release.json >&2 || true
            exit 1
          fi
      - name: Attest all native packages in one statement
        if: steps.preflight.outputs.mode == 'create'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-checksums: assembled/release-metadata/package-subjects.sha256
      - name: Create the immutable package release
        if: steps.preflight.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: packaging-v${{ needs.plan.outputs.mesh_version }}
          TITLE: mesh-llm ${{ needs.plan.outputs.mesh_version }} packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t assets < <(find assembled/release-upload -maxdepth 1 -type f -print0 | sort -z)
          (( ${#assets[@]} == 47 )) || {
            echo "expected 47 immutable release assets, found ${#assets[@]}" >&2
            exit 1
          }
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-body.md
      - name: Verify published release exactly
        if: steps.preflight.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: packaging-v${{ needs.plan.outputs.mesh_version }}
          TITLE: mesh-llm ${{ needs.plan.outputs.mesh_version }} packages
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          release_id="$(jq -er .id published-release.json)"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq 'add' > published-assets.json
          tag_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          fi
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || {
            echo "published release tag resolves to $tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          }
          node --experimental-strip-types scripts/release-evidence.ts compare-release \
            --release published-release.json \
            --assets published-assets.json \
            --output assembled/release-upload \
            --tag "$TAG" \
            --title "$TITLE" \
            --body-file release-body.md \
            --target-sha "$GITHUB_SHA"

  readiness:
    name: Packaging readiness manifest
    if: always()
    needs: [plan, upstream, native-package, runtime-image, homebrew, release-assembly, node-sdk-addon, node-sdk-preflight, publish-node-sdk, publish-images, publish-release-assets]
    runs-on: ubuntu-24.04
    steps:
      - name: Record and enforce required results
        env:
          PLAN: ${{ needs.plan.result }}
          UPSTREAM: ${{ needs.upstream.result }}
          PACKAGES: ${{ needs.native-package.result }}
          IMAGES: ${{ needs.runtime-image.result }}
          HOMEBREW: ${{ needs.homebrew.result }}
          ASSEMBLY_ENABLED: ${{ needs.plan.outputs.release_assembly_enabled }}
          RELEASE_ASSEMBLY: ${{ needs.release-assembly.result }}
          NPM_ENABLED: ${{ needs.plan.outputs.npm_enabled }}
          NPM_ADDONS: ${{ needs.node-sdk-addon.result }}
          NPM_PREFLIGHT: ${{ needs.node-sdk-preflight.result }}
          PUBLISH_NPM_REQUESTED: ${{ needs.plan.outputs.publish_npm }}
          PUBLISH_NPM: ${{ needs.publish-node-sdk.result }}
          PUBLISH_IMAGES: ${{ needs.publish-images.result }}
          PUBLISH_ASSETS: ${{ needs.publish-release-assets.result }}
          PUBLISH_IMAGES_REQUESTED: ${{ needs.plan.outputs.publish_images }}
          PUBLISH_ASSETS_REQUESTED: ${{ needs.plan.outputs.publish_release_assets }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg plan "$PLAN" --arg upstream "$UPSTREAM" --arg packages "$PACKAGES" \
            --arg images "$IMAGES" --arg homebrew "$HOMEBREW" --arg release_assembly "$RELEASE_ASSEMBLY" \
            --arg npm_addons "$NPM_ADDONS" --arg npm_preflight "$NPM_PREFLIGHT" --arg publish_npm "$PUBLISH_NPM" \
            --arg publish_images "$PUBLISH_IMAGES" --arg publish_assets "$PUBLISH_ASSETS" \
            '{plan:$plan,upstream:$upstream,native_packages:$packages,runtime_images:$images,homebrew:$homebrew,release_assembly:$release_assembly,npm_addons:$npm_addons,npm_preflight:$npm_preflight,publish_npm:$publish_npm,publish_images:$publish_images,publish_release_assets:$publish_assets}' \
            | tee packaging-readiness.json
          for required in "$PLAN" "$UPSTREAM" "$PACKAGES" "$IMAGES" "$HOMEBREW"; do
            [[ "$required" == success ]] || exit 1
          done
          if [[ "$ASSEMBLY_ENABLED" == true ]]; then
            [[ "$RELEASE_ASSEMBLY" == success ]] || exit 1
          fi
          if [[ "$NPM_ENABLED" == true ]]; then
            [[ "$NPM_ADDONS" == success && "$NPM_PREFLIGHT" == success ]] || exit 1
          fi
          if [[ "$PUBLISH_NPM_REQUESTED" == true ]]; then
            [[ "$PUBLISH_NPM" == success ]] || exit 1
          fi
          if [[ "$PUBLISH_IMAGES_REQUESTED" == true ]]; then
            [[ "$PUBLISH_IMAGES" == success ]] || exit 1
          fi
          if [[ "$PUBLISH_ASSETS_REQUESTED" == true ]]; then
            [[ "$PUBLISH_ASSETS" == success ]] || exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-readiness
          path: packaging-readiness.json
          if-no-files-found: error
