name: Mesh LLM Images Release

on:
  repository_dispatch:
    types: [mesh-llm-release]
  workflow_dispatch:
    inputs:
      mesh_repository:
        description: mesh-llm repository to clone; push=true and carrack only allow Mesh-LLM/mesh-llm
        required: true
        default: Mesh-LLM/mesh-llm
        type: string
      mesh_ref:
        description: mesh-llm git ref; push=true and carrack require a release tag like v0.66.0
        required: true
        type: string
      mesh_version:
        description: mesh-llm release version without build metadata; push=true must match mesh_ref
        required: true
        type: string
      push:
        description: Push images to GHCR; requires Mesh-LLM/mesh-llm and matching release tag
        required: true
        default: false
        type: boolean
      runner:
        description: Runner pool for manual dry-run iteration
        required: true
        default: github
        type: choice
        options:
          - github
          - carrack
      variant_filter:
        description: Optional comma-separated variant ids or artifact ids, e.g. ubuntu-cpu,alpine-cpu-arm64
        required: false
        default: ''
        type: string
      platform_filter:
        description: Optional comma-separated platforms or arches, e.g. linux/arm64,amd64
        required: false
        default: ''
        type: string
      include_experimental:
        description: Include experimental rows such as Alpine CUDA/ROCm; ignored for push=true releases
        required: true
        default: false
        type: boolean

concurrency:
  group: mesh-llm-images-${{ github.event.client_payload.ref || inputs.mesh_ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'mesh-llm/mesh-llm' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  matrix:
    name: Resolve image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      mesh_repository: ${{ steps.meta.outputs.mesh_repository }}
      mesh_ref: ${{ steps.meta.outputs.mesh_ref }}
      mesh_source_sha: ${{ steps.meta.outputs.mesh_source_sha }}
      mesh_version: ${{ steps.meta.outputs.mesh_version }}
      artifact_version: ${{ steps.matrix.outputs.artifact_version }}
      push: ${{ steps.meta.outputs.push }}
      ui_base_image: ${{ steps.matrix.outputs.ui_base_image }}
      ui_runner_labels: ${{ steps.matrix.outputs.ui_runner_labels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: meta
        shell: bash
        env:
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_REPOSITORY: ${{ inputs.mesh_repository }}
          INPUT_REF: ${{ inputs.mesh_ref }}
          INPUT_VERSION: ${{ inputs.mesh_version }}
          INPUT_PUSH: ${{ inputs.push || 'false' }}
          INPUT_RUNNER: ${{ inputs.runner || 'github' }}
          INPUT_INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_NAME" != "${IMAGE_NAME,,}" ]]; then
            echo "IMAGE_NAME must be lowercase for OCI/GHCR compatibility: $IMAGE_NAME" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._/-]?[a-z0-9]+)*$ ]]; then
            echo "IMAGE_NAME contains unsupported characters: $IMAGE_NAME" >&2
            exit 1
          fi

          repository="${DISPATCH_REPOSITORY:-${INPUT_REPOSITORY:-Mesh-LLM/mesh-llm}}"
          ref="${DISPATCH_REF:-${INPUT_REF:-}}"
          version="${DISPATCH_VERSION:-${INPUT_VERSION:-$ref}}"
          if [[ -z "$ref" || -z "$version" ]]; then
            echo "mesh_ref and mesh_version are required" >&2
            exit 1
          fi
          push="$INPUT_PUSH"
          if [[ "$push" != "true" && "$push" != "false" ]]; then
            echo "push must be true or false, got: $push" >&2
            exit 1
          fi
          runner="$INPUT_RUNNER"
          if [[ "$runner" != "github" && "$runner" != "carrack" ]]; then
            echo "runner must be github or carrack, got: $runner" >&2
            exit 1
          fi
          include_experimental="$INPUT_INCLUDE_EXPERIMENTAL"
          if [[ "$include_experimental" != "true" && "$include_experimental" != "false" ]]; then
            echo "include_experimental must be true or false, got: $include_experimental" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "mesh_version must be a Docker-tag-compatible semver release without build metadata, got: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            push="true"
            runner="github"
            include_experimental="false"
          fi
          if [[ "$push" == "true" ]]; then
            runner="github"
            include_experimental="false"
          fi
          if [[ "$push" == "true" || "$runner" == "carrack" ]]; then
            if [[ "$runner" == "carrack" ]]; then
              include_experimental="false"
            fi
            if [[ "${repository,,}" != "mesh-llm/mesh-llm" ]]; then
              echo "published and carrack image builds must use Mesh-LLM/mesh-llm, got: $repository" >&2
              exit 1
            fi
            if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "published and carrack image builds must use a release tag like v0.66.0 without build metadata, got: $ref" >&2
              exit 1
            fi
            if [[ "${ref#v}" != "${version#v}" ]]; then
              echo "published and carrack image build ref and version disagree: ref=$ref version=$version" >&2
              exit 1
            fi
          fi
          remote_url="https://github.com/${repository}.git"
          fetch_ref="$ref"
          if [[ "$push" == "true" || "$runner" == "carrack" ]]; then
            fetch_ref="refs/tags/$ref"
          fi
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git -C "$tmpdir" init --quiet
          git -C "$tmpdir" remote add origin "$remote_url"
          git -C "$tmpdir" fetch --depth 1 origin "$fetch_ref"
          mesh_source_sha="$(git -C "$tmpdir" rev-parse 'FETCH_HEAD^{commit}')"
          if [[ ! "$mesh_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve mesh_ref to a commit SHA: repository=$repository ref=$ref" >&2
            exit 1
          fi
          {
            echo "mesh_repository=$repository"
            echo "mesh_ref=$ref"
            echo "mesh_source_sha=$mesh_source_sha"
            echo "mesh_version=$version"
            echo "push=$push"
            echo "runner=$runner"
            echo "include_experimental=$include_experimental"
          } >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MESH_REPOSITORY: ${{ steps.meta.outputs.mesh_repository }}
          MESH_REF: ${{ steps.meta.outputs.mesh_ref }}
          MESH_VERSION: ${{ steps.meta.outputs.mesh_version }}
          RUNNER: ${{ steps.meta.outputs.runner }}
          VARIANT_FILTER: ${{ inputs.variant_filter || '' }}
          PLATFORM_FILTER: ${{ inputs.platform_filter || '' }}
          INCLUDE_EXPERIMENTAL: ${{ steps.meta.outputs.include_experimental }}
        run: |
          set -euo pipefail
          experimental_args=()
          if [[ "$INCLUDE_EXPERIMENTAL" == "true" ]]; then
            experimental_args+=(--include-experimental)
          fi
          matrix="$(node --experimental-strip-types scripts/image-matrix.ts github-matrix \
            --version "$MESH_VERSION" \
            --image "$IMAGE" \
            --mesh-ref "$MESH_REF" \
            --mesh-repository "$MESH_REPOSITORY" \
            --runner "$RUNNER" \
            --variant-filter "$VARIANT_FILTER" \
            --platform-filter "$PLATFORM_FILTER" \
            "${experimental_args[@]}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          artifact_version="${MESH_VERSION#refs/tags/}"
          artifact_version="${artifact_version#v}"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          ui_base_image="$(node --experimental-strip-types scripts/image-matrix.ts ui-base-image)"
          echo "ui_base_image=$ui_base_image" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER" == "carrack" ]]; then
            echo 'ui_runner_labels=["self-hosted","Linux","X64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'ui_runner_labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi

  build-ui:
    name: Build shared UI artifact
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.ui_runner_labels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build UI dist artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: ui-artifact
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/ui
          build-args: |
            MESH_LLM_REPOSITORY=${{ needs.matrix.outputs.mesh_repository }}
            MESH_LLM_REF=${{ needs.matrix.outputs.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.matrix.outputs.mesh_source_sha }}
            UI_BASE_IMAGE=${{ needs.matrix.outputs.ui_base_image }}
          cache-from: type=gha,scope=ui-${{ needs.matrix.outputs.mesh_source_sha }}
          cache-to: type=gha,mode=max,scope=ui-${{ needs.matrix.outputs.mesh_source_sha }}
      - name: Verify UI artifact
        run: test -d artifacts/ui/dist
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-llm-ui-${{ needs.matrix.outputs.artifact_version }}
          path: artifacts/ui/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build binary ${{ matrix.variant_id }} ${{ matrix.arch }}
    needs: [matrix, build-ui, build-llama]
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mesh-llm-ui-${{ needs.matrix.outputs.artifact_version }}
          path: artifacts/ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.llama_artifact_name }}
          path: artifacts/llama/llama
      - uses: docker/setup-buildx-action@v3
      - name: Build mesh-llm binary artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: binary-artifact
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=artifacts/binary
          build-args: |
            MESH_LLM_REPOSITORY=${{ matrix.mesh_repository }}
            MESH_LLM_REF=${{ matrix.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.matrix.outputs.mesh_source_sha }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_architectures }}
            ROCM_ARCHITECTURES=${{ matrix.rocm_architectures }}
            BUILD_BASE_IMAGE=${{ matrix.build_base_image }}
          cache-from: |
            type=gha,scope=binary-${{ matrix.artifact_id }}
            type=gha,scope=llama-${{ matrix.artifact_id }}
          cache-to: type=gha,mode=max,scope=binary-${{ matrix.artifact_id }}
      - name: Verify binary artifact
        run: |
          test -f artifacts/binary/mesh-llm
          (cd artifacts/binary && sha256sum mesh-llm > SHA256SUMS)
          cp artifacts/binary/SHA256SUMS artifacts/binary/mesh-llm.sha256
      - name: Generate binary SBOM
        uses: anchore/sbom-action@77de16b1e6ebabe4c646e3f853a3133f607fa36c
        with:
          path: artifacts/binary/mesh-llm
          format: spdx-json
          output-file: artifacts/binary/mesh-llm.spdx.json
          upload-artifact: false
      - name: Attest binary artifact
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/binary/SHA256SUMS
      - name: Attest binary SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/binary/SHA256SUMS
          sbom-path: artifacts/binary/mesh-llm.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: |
            artifacts/binary/mesh-llm
            artifacts/binary/SHA256SUMS
            artifacts/binary/mesh-llm.sha256
            artifacts/binary/mesh-llm.spdx.json
          if-no-files-found: error
          retention-days: 7

  build-native-package:
    name: Build native package ${{ matrix.variant_id }} ${{ matrix.arch }}
    needs: [matrix, build]
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: artifacts/binary
      - uses: docker/setup-buildx-action@v3
      - name: Build native package artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: native-package-artifact
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=artifacts/native-package
          build-args: |
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            TARGET_ARCH=${{ matrix.arch }}
            MESH_LLM_VERSION=${{ matrix.mesh_version }}
            PACKAGE_BASE_IMAGE=${{ matrix.package_base_image }}
          cache-from: type=gha,scope=native-package-${{ matrix.artifact_id }}
          cache-to: type=gha,mode=max,scope=native-package-${{ matrix.artifact_id }}
      - name: Verify native package artifact
        run: |
          scripts/native-package-qa.sh \
            --distro '${{ matrix.distro }}' \
            --backend '${{ matrix.backend }}' \
            --backend-version '${{ matrix.backend_version }}' \
            --arch '${{ matrix.arch }}' \
            --version '${{ matrix.mesh_version }}' \
            --package-format '${{ matrix.package_format }}' \
            --package-dir artifacts/native-package \
            --runtime-base-image '${{ matrix.runtime_base_image }}' \
            --install
      - name: Generate native package SBOM
        uses: anchore/sbom-action@77de16b1e6ebabe4c646e3f853a3133f607fa36c
        with:
          path: artifacts/native-package
          format: spdx-json
          output-file: artifacts/native-package/native-package.spdx.json
          upload-artifact: false
      - name: Attest native package artifact
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/native-package/SHA256SUMS
      - name: Attest native package SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/native-package/SHA256SUMS
          sbom-path: artifacts/native-package/native-package.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: |
            artifacts/native-package/*.${{ matrix.package_format }}
            artifacts/native-package/SHA256SUMS
            artifacts/native-package/*.${{ matrix.package_format }}.sha256
            artifacts/native-package/native-package.spdx.json
          if-no-files-found: error
          retention-days: 7

  build-llama:
    name: Build llama ABI ${{ matrix.variant_id }} ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build llama ABI artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: llama-artifact
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=artifacts/llama
          build-args: |
            MESH_LLM_REPOSITORY=${{ matrix.mesh_repository }}
            MESH_LLM_REF=${{ matrix.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.matrix.outputs.mesh_source_sha }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_architectures }}
            ROCM_ARCHITECTURES=${{ matrix.rocm_architectures }}
            BUILD_BASE_IMAGE=${{ matrix.build_base_image }}
          cache-from: type=gha,scope=llama-${{ matrix.artifact_id }}
          cache-to: type=gha,mode=max,scope=llama-${{ matrix.artifact_id }}
      - name: Verify llama ABI artifact
        run: |
          test -f artifacts/llama/llama/.mesh-llm-build-stamp
          test -f artifacts/llama/llama/CMakeCache.txt
          test -f artifacts/llama/llama/src/libllama.a
          test -f artifacts/llama/llama/common/libllama-common.a
          test -f artifacts/llama/llama/tools/mtmd/libmtmd.a
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.llama_artifact_name }}
          path: artifacts/llama/llama
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.variant_id }} ${{ matrix.arch }}
    needs: [matrix, build-native-package]
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: artifacts/native-package
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: needs.matrix.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mesh-llm
          target: runtime
          platforms: ${{ matrix.platform }}
          push: ${{ needs.matrix.outputs.push == 'true' }}
          load: ${{ needs.matrix.outputs.push != 'true' && matrix.platform == 'linux/amd64' }}
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.mesh_repository }}
            org.opencontainers.image.version=${{ matrix.mesh_version }}
            org.opencontainers.image.revision=${{ needs.matrix.outputs.mesh_source_sha }}
            org.opencontainers.image.ref.name=${{ matrix.mesh_ref }}
            org.opencontainers.image.description=mesh-llm ${{ matrix.distro }} ${{ matrix.arch }} ${{ matrix.backend }}${{ matrix.backend_version }} image
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          build-args: |
            MESH_LLM_REPOSITORY=${{ matrix.mesh_repository }}
            MESH_LLM_REF=${{ matrix.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ needs.matrix.outputs.mesh_source_sha }}
            MESH_LLM_VERSION=${{ matrix.mesh_version }}
            DISTRO=${{ matrix.distro }}
            BACKEND=${{ matrix.backend }}
            BACKEND_VERSION=${{ matrix.backend_version }}
            RUNTIME_BASE_IMAGE=${{ matrix.runtime_base_image }}
          cache-from: type=gha,scope=package-${{ matrix.artifact_id }}
          cache-to: type=gha,mode=max,scope=package-${{ matrix.artifact_id }}
      - name: Record image digest
        if: steps.build-image.outputs.digest != ''
        run: |
          mkdir -p artifacts/image-digest
          {
            echo 'image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}'
            echo 'tags=${{ matrix.tags }}'
            echo 'digest=${{ steps.build-image.outputs.digest }}'
          } > artifacts/image-digest/${{ matrix.artifact_id }}.digest
      - name: Generate image SBOM
        if: needs.matrix.outputs.push == 'true'
        uses: anchore/sbom-action@77de16b1e6ebabe4c646e3f853a3133f607fa36c
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-image.outputs.digest }}
          format: spdx-json
          output-file: artifacts/image-digest/${{ matrix.artifact_id }}.spdx.json
          upload-artifact: false
      - name: Attest image provenance
        if: needs.matrix.outputs.push == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        if: needs.matrix.outputs.push == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          sbom-path: artifacts/image-digest/${{ matrix.artifact_id }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        if: steps.build-image.outputs.digest != ''
        with:
          name: mesh-llm-image-digest-${{ needs.matrix.outputs.artifact_version }}-${{ matrix.artifact_id }}
          path: artifacts/image-digest
          if-no-files-found: error
          retention-days: 7

  ensure-github-release:
    name: Ensure GitHub Release exists
    needs: matrix
    if: needs.matrix.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.matrix.outputs.mesh_ref }}
          MESH_SOURCE_SHA: ${{ needs.matrix.outputs.mesh_source_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists"
            exit 0
          fi

          cat > release-notes.md <<EOF
          Automated mesh-agent-images package and image provenance assets for ${RELEASE_TAG}.

          Source repository: Mesh-LLM/mesh-llm
          Source commit: ${MESH_SOURCE_SHA}
          EOF

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "mesh-llm ${RELEASE_TAG}" \
            --notes-file release-notes.md

  publish-release-assets:
    name: Promote release assets ${{ matrix.variant_id }} ${{ matrix.arch }}
    needs: [matrix, build-native-package, package, ensure-github-release]
    if: needs.matrix.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_package_artifact_name }}
          path: artifacts/native-package
      - uses: actions/download-artifact@v4
        with:
          name: mesh-llm-image-digest-${{ needs.matrix.outputs.artifact_version }}-${{ matrix.artifact_id }}
          path: artifacts/image-digest
      - name: Prepare GitHub Release assets
        env:
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MESH_REF: ${{ needs.matrix.outputs.mesh_ref }}
          MESH_SOURCE_SHA: ${{ needs.matrix.outputs.mesh_source_sha }}
          MESH_VERSION: ${{ matrix.mesh_version }}
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          package_file_count=0
          while IFS= read -r -d '' package_file; do
            cp "$package_file" "release-assets/$(basename "$package_file")"
            package_file_count=$((package_file_count + 1))
          done < <(find artifacts/native-package -maxdepth 1 -type f -name "*.${PACKAGE_FORMAT}" -print0)
          if [[ "$package_file_count" -ne 1 ]]; then
            echo "expected exactly one native package for ${ARTIFACT_ID}, found ${package_file_count}" >&2
            exit 1
          fi

          checksum_file_count=0
          while IFS= read -r -d '' checksum_file; do
            cp "$checksum_file" "release-assets/$(basename "$checksum_file")"
            checksum_file_count=$((checksum_file_count + 1))
          done < <(find artifacts/native-package -maxdepth 1 -type f -name "*.${PACKAGE_FORMAT}.sha256" -print0)
          if [[ "$checksum_file_count" -ne 1 ]]; then
            echo "expected exactly one native package .sha256 for ${ARTIFACT_ID}, found ${checksum_file_count}" >&2
            exit 1
          fi

          cp artifacts/native-package/SHA256SUMS "release-assets/${ARTIFACT_ID}-native-package-SHA256SUMS"
          cp artifacts/native-package/native-package.spdx.json "release-assets/${ARTIFACT_ID}-native-package.spdx.json"
          cp artifacts/image-digest/${ARTIFACT_ID}.digest "release-assets/${ARTIFACT_ID}.digest"
          cp artifacts/image-digest/${ARTIFACT_ID}.spdx.json "release-assets/${ARTIFACT_ID}-image.spdx.json"

          image_digest="$(awk -F= '$1 == "digest" { print $2 }' "artifacts/image-digest/${ARTIFACT_ID}.digest")"
          if [[ -z "$image_digest" ]]; then
            echo "missing image digest for ${ARTIFACT_ID}" >&2
            exit 1
          fi

          package_name="$(find release-assets -maxdepth 1 -type f -name "*.${PACKAGE_FORMAT}" -exec basename {} \;)"
          cat > "release-assets/${ARTIFACT_ID}-attestations.md" <<EOF
          # mesh-llm ${MESH_VERSION} ${ARTIFACT_ID} attestations

          Source ref: ${MESH_REF}
          Source commit: ${MESH_SOURCE_SHA}

          GitHub artifact attestations were generated during this workflow for the
          native package checksums in ${ARTIFACT_ID}-native-package-SHA256SUMS.
          Verify the package asset with:

          \`\`\`bash
          gh attestation verify ${package_name} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          The pushed image was attested by registry digest. Verify it with:

          \`\`\`bash
          gh attestation verify oci://${IMAGE_REF}@${image_digest} --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.matrix.outputs.mesh_ref }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
