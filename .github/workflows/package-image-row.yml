name: Package and stage one image row

on:
  workflow_call:
    inputs:
      row_json:
        description: One exact row from the checked-in packaging matrix
        required: true
        type: string
      image_name:
        description: Canonical OCI image repository
        required: true
        type: string
      mesh_ref:
        required: true
        type: string
      mesh_sha:
        required: true
        type: string
      source_date_epoch:
        description: Nonnegative Unix timestamp of the immutable upstream source commit
        required: true
        type: string
      publish_images:
        required: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The MeshLLM Depot project owns the persistent remote BuildKit cache.
  DEPOT_PROJECT_ID: mzm95zcv7p

jobs:
  package:
    name: Produce native package
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
        && github.repository == 'Mesh-LLM/mesh-packaging'
        && github.ref == 'refs/heads/main'
        && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
        && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        && (
          fromJSON(inputs.row_json).arch == 'arm64'
          && 'depot-ubuntu-24.04-arm'
          || 'depot-ubuntu-24.04'
        )
        || fromJSON(fromJSON(inputs.row_json).runner_labels)
      }}
    outputs:
      package_base_image: ${{ steps.bases.outputs.package_base_image }}
      package_base_source: ${{ steps.bases.outputs.package_base_source }}
      runtime_base_source: ${{ steps.bases.outputs.runtime_base_source }}
      runtime_base_image: ${{ steps.bases.outputs.runtime_base_image }}
      registry_cache_selected: ${{ steps.bases.outputs.registry_cache_selected }}
      depot_registry_host: ${{ steps.bases.outputs.depot_registry_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ fromJSON(inputs.row_json).upstream_artifact_id }}
          path: artifacts/upstream
      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
        with:
          version: 2.101.77
      - name: Resolve exact package and runtime base images
        id: bases
        env:
          CACHE_ENABLED: ${{ vars.DEPOT_REGISTRY_CACHE_ENABLED }}
          DEPOT_REGISTRY_HOST: ${{ vars.DEPOT_REGISTRY_HOST }}
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_BASE: ${{ fromJSON(inputs.row_json).package_base_image }}
          PACKAGE_CACHE_REPOSITORY: ${{ fromJSON(inputs.row_json).package_base_cache_repository }}
          REPOSITORY: ${{ github.repository }}
          RUNTIME_BASE: ${{ fromJSON(inputs.row_json).runtime_base_image }}
          RUNTIME_CACHE_REPOSITORY: ${{ fromJSON(inputs.row_json).runtime_base_cache_repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_ref() {
            local ref="$1"
            local raw digest name
            raw="$(mktemp)"
            docker buildx imagetools inspect "$ref" --raw > "$raw"
            digest="sha256:$(sha256sum "$raw" | awk '{ print $1 }')"
            rm -f "$raw"
            name="${ref%%@*}"
            if [[ "$name" == "$ref" ]]; then
              slash_tail="${ref##*/}"
              if [[ "$slash_tail" == *:* ]]; then name="${ref%:*}"; fi
            fi
            printf '%s@%s' "$name" "$digest"
          }
          package_base_image="$(resolve_ref "$PACKAGE_BASE")"
          runtime_base_image="$(resolve_ref "$RUNTIME_BASE")"
          package_base_source="$package_base_image"
          runtime_base_source="$runtime_base_image"
          registry_cache_selected=false
          depot_registry_host=

          if [[ "$CACHE_ENABLED" == true &&
                "$REPOSITORY" == Mesh-LLM/mesh-packaging &&
                "$WORKFLOW_SOURCE_REF" == refs/heads/main &&
                "$WORKFLOW_REF" == Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main ]]; then
            [[ "${DEPOT_ORG_ID:-}" == 1ntz5vlngn ]] || {
              echo "pull-through bases require a pre-authenticated Depot runner" >&2
              exit 1
            }
            case "$EVENT_NAME" in
              repository_dispatch|workflow_dispatch) ;;
              *) echo "pull-through bases rejected event: $EVENT_NAME" >&2; exit 1 ;;
            esac
            [[ "$DEPOT_REGISTRY_HOST" =~ ^[a-z0-9-]+\.registry\.depot\.dev$ ]] || {
              echo "DEPOT_REGISTRY_HOST is invalid" >&2
              exit 1
            }
            for repository in "$PACKAGE_CACHE_REPOSITORY" "$RUNTIME_CACHE_REPOSITORY"; do
              [[ "$repository" =~ ^[a-z0-9]+([._/-]?[a-z0-9]+)*$ &&
                 "$repository" != *..* ]] || {
                echo "invalid pull-through repository: $repository" >&2
                exit 1
              }
            done
            package_base_image="$DEPOT_REGISTRY_HOST/$PACKAGE_CACHE_REPOSITORY@${package_base_image##*@}"
            runtime_base_image="$DEPOT_REGISTRY_HOST/$RUNTIME_CACHE_REPOSITORY@${runtime_base_image##*@}"
            registry_cache_selected=true
            depot_registry_host="$DEPOT_REGISTRY_HOST"
          fi
          {
            echo "package_base_image=$package_base_image"
            echo "package_base_source=$package_base_source"
            echo "runtime_base_source=$runtime_base_source"
            echo "runtime_base_image=$runtime_base_image"
            echo "registry_cache_selected=$registry_cache_selected"
            echo "depot_registry_host=$depot_registry_host"
          } >> "$GITHUB_OUTPUT"
      - name: Verify exact pull-through base manifests
        if: steps.bases.outputs.registry_cache_selected == 'true'
        env:
          PACKAGE_BASE_IMAGE: ${{ steps.bases.outputs.package_base_image }}
          RUNTIME_BASE_IMAGE: ${{ steps.bases.outputs.runtime_base_image }}
        shell: bash
        run: |
          set -euo pipefail
          for image in "$PACKAGE_BASE_IMAGE" "$RUNTIME_BASE_IMAGE"; do
            raw="$(mktemp)"
            docker buildx imagetools inspect "$image" --raw > "$raw"
            actual_digest="sha256:$(sha256sum "$raw" | awk '{ print $1 }')"
            rm -f "$raw"
            [[ "$actual_digest" == "${image##*@}" ]] || {
              echo "pull-through digest mismatch for $image" >&2
              exit 1
            }
          done
      - name: Start Depot native package measurement
        id: package_measurement
        shell: bash
        run: |
          set -euo pipefail
          context_bytes="$(du -sb . | awk '{ print $1 }')"
          echo "context_bytes=$context_bytes" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build native package from verified upstream product bundle
        id: package
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: .
          file: docker/Dockerfile.mesh-llm
          target: native-package-artifact
          platforms: ${{ fromJSON(inputs.row_json).platform }}
          build-args: |
            PACKAGE_BASE_IMAGE=${{ steps.bases.outputs.package_base_image }}
            DISTRO=${{ fromJSON(inputs.row_json).distro }}
            BACKEND=${{ fromJSON(inputs.row_json).backend }}
            BACKEND_VERSION=${{ fromJSON(inputs.row_json).backend_version }}
            TARGET_ARCH=${{ fromJSON(inputs.row_json).arch }}
            MESH_LLM_VERSION=${{ fromJSON(inputs.row_json).mesh_version }}
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
          # Package QA and artifact upload require the package bytes on the runner.
          outputs: type=local,dest=artifacts/native-package
          # Preserve a BuildKit attestation when the exporter can provide one.
          provenance: mode=max
      - name: Record Depot native package measurement
        if: always()
        env:
          ARTIFACT_ID: ${{ fromJSON(inputs.row_json).artifact_id }}
          ARCH: ${{ fromJSON(inputs.row_json).arch }}
          BACKEND: ${{ fromJSON(inputs.row_json).backend }}
          BACKEND_VERSION: ${{ fromJSON(inputs.row_json).backend_version }}
          CONTEXT_BYTES: ${{ steps.package_measurement.outputs.context_bytes }}
          DEPOT_BUILD_ID: ${{ steps.package.outputs.build-id }}
          DEPOT_PROJECT_OUTPUT: ${{ steps.package.outputs.project-id }}
          DISTRO: ${{ fromJSON(inputs.row_json).distro }}
          PLATFORM: ${{ fromJSON(inputs.row_json).platform }}
          RUNNER_LABELS_JSON: >-
            ${{ toJSON(
              vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
              && github.repository == 'Mesh-LLM/mesh-packaging'
              && github.ref == 'refs/heads/main'
              && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
              && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
              && (
              fromJSON(inputs.row_json).arch == 'arm64'
              && 'depot-ubuntu-24.04-arm'
              || 'depot-ubuntu-24.04'
              )
              || fromJSON(fromJSON(inputs.row_json).runner_labels)
            ) }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          START_AT: ${{ steps.package_measurement.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          end_at="$(date +%s)"
          if [[ "$START_AT" =~ ^[0-9]+$ ]]; then
            action_seconds_json="$((end_at - START_AT))"
          else
            action_seconds_json=null
          fi
          if [[ "$CONTEXT_BYTES" =~ ^[0-9]+$ ]]; then
            context_bytes_json="$CONTEXT_BYTES"
          else
            context_bytes_json=null
          fi
          project_id="${DEPOT_PROJECT_OUTPUT:-$DEPOT_PROJECT_ID}"
          mkdir -p artifacts/depot-build
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg phase native-package \
            --arg platform "$PLATFORM" \
            --arg arch "$ARCH" \
            --arg distro "$DISTRO" \
            --arg backend "$BACKEND" \
            --arg backend_version "$BACKEND_VERSION" \
            --arg runner_name "$ACTUAL_RUNNER_NAME" --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --argjson runner_labels "$RUNNER_LABELS_JSON" \
            --arg project_id "$project_id" \
            --arg build_id "$DEPOT_BUILD_ID" \
            --argjson action_seconds "$action_seconds_json" \
            --argjson context_bytes_estimate "$context_bytes_json" \
            '{
              schema_version: 1,
              artifact_id: $artifact_id,
              phase: $phase,
              matrix: {
                platform: $platform,
                arch: $arch,
                distro: $distro,
                backend: $backend,
                backend_version: $backend_version
              },
              runner: {labels: $runner_labels, name: $runner_name, environment: $runner_environment},
              depot: {
                project_id: (if $project_id == "" then null else $project_id end),
                build_id: (if $build_id == "" then null else $build_id end)
              },
              measurements: {
                action_seconds: $action_seconds,
                context_bytes_estimate: $context_bytes_estimate,
                cache_state: "unclassified",
                cache_hit_rate: null,
                context_upload_seconds: null,
                cache_import_seconds: null,
                cache_export_seconds: null,
                cpu_utilization_percent: null,
                cost_usd: null
              }
            }' > "artifacts/depot-build/${ARTIFACT_ID}-native-package.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: depot-build-${{ fromJSON(inputs.row_json).artifact_id }}-native-package
          path: artifacts/depot-build/${{ fromJSON(inputs.row_json).artifact_id }}-native-package.json
          if-no-files-found: error
          retention-days: 14
      - name: Namespace exact package build provenance
        env:
          ARTIFACT_ID: ${{ fromJSON(inputs.row_json).artifact_id }}
          DEPOT_BUILD_ID: ${{ steps.package.outputs.build-id }}
          DEPOT_PROJECT_ID: ${{ steps.package.outputs.project-id }}
          PACKAGE_FILE: ${{ fromJSON(inputs.row_json).package_file }}
        shell: bash
        run: |
          set -euo pipefail
          package_sha="$(sha256sum "artifacts/native-package/$PACKAGE_FILE" | awk '{ print $1 }')"
          exporter_provenance="artifacts/native-package/provenance.json"
          provenance="artifacts/native-package/$ARTIFACT_ID.buildkit-provenance.json"
          has_exact_subject() {
            jq -e --arg name "$PACKAGE_FILE" --arg digest "$package_sha" '
              ._type == "https://in-toto.io/Statement/v1" and
              (.subject | length) == 1 and
              .subject[0].name == $name and
              .subject[0].digest.sha256 == $digest
            ' "$1" >/dev/null
          }
          # Depot's local exporter can emit an image-stage statement rather than
          # one for the exported package. Preserve an exact statement; otherwise
          # bind the exact package bytes to the remote Depot build.
          if has_exact_subject "$exporter_provenance" 2>/dev/null; then
            mv "$exporter_provenance" "$provenance"
          else
            rm -f "$exporter_provenance"
            [[ "$DEPOT_BUILD_ID" =~ ^[a-z0-9]+$ ]]
            [[ "$DEPOT_PROJECT_ID" =~ ^[a-z0-9]+$ ]]
            jq_args=(
              --arg name "$PACKAGE_FILE"
              --arg digest "$package_sha"
              --arg project_id "$DEPOT_PROJECT_ID"
              --arg build_id "$DEPOT_BUILD_ID"
            )
            jq -n "${jq_args[@]}" '
              {
                _type: "https://in-toto.io/Statement/v1",
                subject: [{name: $name, digest: {sha256: $digest}}],
                predicateType: "https://meshllm.cloud/depot-build-receipt/v1",
                predicate: {
                  builder: {
                    id: ("https://depot.dev/projects/" + $project_id + "/builds/" + $build_id)
                  },
                  build: {project_id: $project_id, build_id: $build_id}
                }
              }
            ' > "$provenance"
          fi
          has_exact_subject "$provenance"
      - name: Verify and install package
        shell: bash
        run: |
          scripts/native-package-qa.sh \
            --distro "${{ fromJSON(inputs.row_json).distro }}" \
            --backend "${{ fromJSON(inputs.row_json).backend }}" \
            --backend-version "${{ fromJSON(inputs.row_json).backend_version }}" \
            --arch "${{ fromJSON(inputs.row_json).arch }}" \
            --version "${{ fromJSON(inputs.row_json).mesh_version }}" \
            --package-format "${{ fromJSON(inputs.row_json).package_format }}" \
            --package-dir artifacts/native-package \
            --runtime-base-image "${{ steps.bases.outputs.runtime_base_image }}" \
            --install
      - name: Attach exact upstream provenance to package artifact
        run: cp artifacts/upstream/upstream-provenance.json "artifacts/native-package/${{ fromJSON(inputs.row_json).artifact_id }}.upstream-provenance.json"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: artifacts/native-package/${{ fromJSON(inputs.row_json).package_file }}
          format: spdx-json
          output-file: artifacts/native-package/${{ fromJSON(inputs.row_json).artifact_id }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Verify exact package SBOM subject
        run: |
          node --experimental-strip-types scripts/verify-sbom-subject.ts \
            --package "artifacts/native-package/${{ fromJSON(inputs.row_json).package_file }}" \
            --sidecar "artifacts/native-package/${{ fromJSON(inputs.row_json).package_file }}.sha256" \
            --sbom "artifacts/native-package/${{ fromJSON(inputs.row_json).artifact_id }}.spdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ fromJSON(inputs.row_json).native_package_artifact_name }}
          path: artifacts/native-package
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  dry-image:
    name: Build and test local final image
    if: ${{ !inputs.publish_images }}
    needs: package
    permissions:
      contents: read
      id-token: write
    runs-on: >-
      ${{
        vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
        && github.repository == 'Mesh-LLM/mesh-packaging'
        && github.ref == 'refs/heads/main'
        && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
        && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        && (
          fromJSON(inputs.row_json).arch == 'arm64'
          && 'depot-ubuntu-24.04-arm'
          || 'depot-ubuntu-24.04'
        )
        || fromJSON(fromJSON(inputs.row_json).runner_labels)
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ fromJSON(inputs.row_json).native_package_artifact_name }}
          path: artifacts/native-package
      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
        with:
          version: 2.101.77
      - name: Read immutable product inputs
        id: product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t provenance_files < <(find artifacts/native-package -name '*.upstream-provenance.json' -type f -print0)
          if (( ${#provenance_files[@]} != 1 )); then
            echo "expected exactly one upstream provenance file, found ${#provenance_files[@]}" >&2
            exit 1
          fi
          provenance="${provenance_files[0]}"
          jq -e '
            (.host_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.runtime_id | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.runtime_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$provenance" >/dev/null
          {
            echo "host_sha=$(jq -r .host_sha256 "$provenance")"
            echo "runtime_id=$(jq -r .runtime_id "$provenance")"
            echo "runtime_sha=$(jq -r .runtime_sha256 "$provenance")"
          } >> "$GITHUB_OUTPUT"
      - name: Start Depot dry-image measurement
        id: dry_measurement
        shell: bash
        run: |
          set -euo pipefail
          context_bytes="$(du -sb . | awk '{ print $1 }')"
          echo "context_bytes=$context_bytes" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build the final runtime image once
        id: image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: .
          file: docker/Dockerfile.mesh-llm
          target: runtime
          platforms: ${{ fromJSON(inputs.row_json).platform }}
          # Runtime QA runs Docker commands on the runner, so only this dry-run image is loaded.
          load: true
          tags: mesh-packaging-local:${{ fromJSON(inputs.row_json).artifact_id }}
          build-args: |
            RUNTIME_BASE_IMAGE=${{ needs.package.outputs.runtime_base_image }}
            PACKAGE_FILE=${{ fromJSON(inputs.row_json).package_file }}
            DISTRO=${{ fromJSON(inputs.row_json).distro }}
            BACKEND=${{ fromJSON(inputs.row_json).backend }}
            BACKEND_VERSION=${{ fromJSON(inputs.row_json).backend_version }}
            MESH_LLM_VERSION=${{ fromJSON(inputs.row_json).mesh_version }}
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
            MESH_LLM_REF=${{ inputs.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ inputs.mesh_sha }}
            MESH_LLM_HOST_SHA=${{ steps.product.outputs.host_sha }}
            MESH_LLM_RUNTIME_ID=${{ steps.product.outputs.runtime_id }}
            MESH_LLM_RUNTIME_SHA=${{ steps.product.outputs.runtime_sha }}
      - name: Record Depot dry-image measurement
        if: always()
        env:
          ARTIFACT_ID: ${{ fromJSON(inputs.row_json).artifact_id }}
          ARCH: ${{ fromJSON(inputs.row_json).arch }}
          BACKEND: ${{ fromJSON(inputs.row_json).backend }}
          BACKEND_VERSION: ${{ fromJSON(inputs.row_json).backend_version }}
          CONTEXT_BYTES: ${{ steps.dry_measurement.outputs.context_bytes }}
          DEPOT_BUILD_ID: ${{ steps.image.outputs.build-id }}
          DEPOT_PROJECT_OUTPUT: ${{ steps.image.outputs.project-id }}
          DISTRO: ${{ fromJSON(inputs.row_json).distro }}
          PLATFORM: ${{ fromJSON(inputs.row_json).platform }}
          RUNNER_LABELS_JSON: >-
            ${{ toJSON(
              vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
              && github.repository == 'Mesh-LLM/mesh-packaging'
              && github.ref == 'refs/heads/main'
              && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
              && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
              && (
              fromJSON(inputs.row_json).arch == 'arm64'
              && 'depot-ubuntu-24.04-arm'
              || 'depot-ubuntu-24.04'
              )
              || fromJSON(fromJSON(inputs.row_json).runner_labels)
            ) }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          START_AT: ${{ steps.dry_measurement.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          end_at="$(date +%s)"
          if [[ "$START_AT" =~ ^[0-9]+$ ]]; then
            action_seconds_json="$((end_at - START_AT))"
          else
            action_seconds_json=null
          fi
          if [[ "$CONTEXT_BYTES" =~ ^[0-9]+$ ]]; then
            context_bytes_json="$CONTEXT_BYTES"
          else
            context_bytes_json=null
          fi
          project_id="${DEPOT_PROJECT_OUTPUT:-$DEPOT_PROJECT_ID}"
          mkdir -p artifacts/depot-build
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg phase runtime-image-dry \
            --arg platform "$PLATFORM" \
            --arg arch "$ARCH" \
            --arg distro "$DISTRO" \
            --arg backend "$BACKEND" \
            --arg backend_version "$BACKEND_VERSION" \
            --arg runner_name "$ACTUAL_RUNNER_NAME" --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --argjson runner_labels "$RUNNER_LABELS_JSON" \
            --arg project_id "$project_id" \
            --arg build_id "$DEPOT_BUILD_ID" \
            --argjson action_seconds "$action_seconds_json" \
            --argjson context_bytes_estimate "$context_bytes_json" \
            '{
              schema_version: 1,
              artifact_id: $artifact_id,
              phase: $phase,
              matrix: {
                platform: $platform,
                arch: $arch,
                distro: $distro,
                backend: $backend,
                backend_version: $backend_version
              },
              runner: {labels: $runner_labels, name: $runner_name, environment: $runner_environment},
              depot: {
                project_id: (if $project_id == "" then null else $project_id end),
                build_id: (if $build_id == "" then null else $build_id end)
              },
              measurements: {
                action_seconds: $action_seconds,
                context_bytes_estimate: $context_bytes_estimate,
                cache_state: "unclassified",
                cache_hit_rate: null,
                context_upload_seconds: null,
                cache_import_seconds: null,
                cache_export_seconds: null,
                cpu_utilization_percent: null,
                cost_usd: null
              }
            }' > "artifacts/depot-build/${ARTIFACT_ID}-runtime-image-dry.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: depot-build-${{ fromJSON(inputs.row_json).artifact_id }}-runtime-image-dry
          path: artifacts/depot-build/${{ fromJSON(inputs.row_json).artifact_id }}-runtime-image-dry.json
          if-no-files-found: error
          retention-days: 14
      - name: Test the exact locally loaded final image
        env:
          IMAGE_REF: mesh-packaging-local:${{ fromJSON(inputs.row_json).artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE/docker/qa-runtime-image.sh:/tmp/qa-runtime-image.sh:ro" \
            "$IMAGE_REF" /tmp/qa-runtime-image.sh \
            "${{ fromJSON(inputs.row_json).distro }}" \
            "${{ fromJSON(inputs.row_json).backend }}" \
            "${{ fromJSON(inputs.row_json).mesh_version }}"
          docker run --rm --entrypoint sh \
            -v "$GITHUB_WORKSPACE/scripts/client-readiness-smoke.sh:/tmp/client-readiness-smoke.sh:ro" \
            "$IMAGE_REF" -c \
            'MESH_LLM_SMOKE_BIN=/usr/local/bin/mesh-llm-entrypoint sh /tmp/client-readiness-smoke.sh'
          jq -n \
            --arg artifact_id "${{ fromJSON(inputs.row_json).artifact_id }}" \
            --arg image_id "$image_id" \
            --arg runtime_base_image "${{ needs.package.outputs.runtime_base_image }}" \
            '{schema_version:1, artifact_id:$artifact_id, mode:"local", image_id:$image_id, runtime_base_image:$runtime_base_image, qa:{passed:true,image_id:$image_id}}' \
            > image-row-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-llm-image-result-${{ fromJSON(inputs.row_json).artifact_id }}
          path: image-row-result.json
          if-no-files-found: error
          retention-days: 14

  stage-image:
    name: Stage and test exact registry digest
    if: ${{ inputs.publish_images }}
    needs: package
    runs-on: >-
      ${{
        vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
        && github.repository == 'Mesh-LLM/mesh-packaging'
        && github.ref == 'refs/heads/main'
        && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
        && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        && (
          fromJSON(inputs.row_json).arch == 'arm64'
          && 'depot-ubuntu-24.04-arm'
          || 'depot-ubuntu-24.04'
        )
        || fromJSON(fromJSON(inputs.row_json).runner_labels)
      }}
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ fromJSON(inputs.row_json).native_package_artifact_name }}
          path: artifacts/native-package
      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1
        with:
          version: 2.101.77
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read immutable product inputs
        id: product
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t provenance_files < <(find artifacts/native-package -name '*.upstream-provenance.json' -type f -print0)
          if (( ${#provenance_files[@]} != 1 )); then
            echo "expected exactly one upstream provenance file, found ${#provenance_files[@]}" >&2
            exit 1
          fi
          provenance="${provenance_files[0]}"
          jq -e '
            (.host_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
            (.runtime_id | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and
            (.runtime_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$provenance" >/dev/null
          {
            echo "host_sha=$(jq -r .host_sha256 "$provenance")"
            echo "runtime_id=$(jq -r .runtime_id "$provenance")"
            echo "runtime_sha=$(jq -r .runtime_sha256 "$provenance")"
          } >> "$GITHUB_OUTPUT"
      - name: Start Depot staged-image measurement
        id: stage_measurement
        shell: bash
        run: |
          set -euo pipefail
          context_bytes="$(du -sb . | awk '{ print $1 }')"
          echo "context_bytes=$context_bytes" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and push one run-scoped staging image
        id: stage
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: .
          file: docker/Dockerfile.mesh-llm
          target: runtime
          platforms: ${{ fromJSON(inputs.row_json).platform }}
          # Push directly from Depot; downstream QA pulls the exact emitted digest.
          push: true
          tags: ${{ inputs.image_name }}:staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.row_json).artifact_id }}
          build-args: |
            RUNTIME_BASE_IMAGE=${{ needs.package.outputs.runtime_base_image }}
            PACKAGE_FILE=${{ fromJSON(inputs.row_json).package_file }}
            DISTRO=${{ fromJSON(inputs.row_json).distro }}
            BACKEND=${{ fromJSON(inputs.row_json).backend }}
            BACKEND_VERSION=${{ fromJSON(inputs.row_json).backend_version }}
            MESH_LLM_VERSION=${{ fromJSON(inputs.row_json).mesh_version }}
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
            MESH_LLM_REF=${{ inputs.mesh_ref }}
            MESH_LLM_SOURCE_SHA=${{ inputs.mesh_sha }}
            MESH_LLM_HOST_SHA=${{ steps.product.outputs.host_sha }}
            MESH_LLM_RUNTIME_ID=${{ steps.product.outputs.runtime_id }}
            MESH_LLM_RUNTIME_SHA=${{ steps.product.outputs.runtime_sha }}
      - name: Record Depot staged-image measurement
        if: always()
        env:
          ARTIFACT_ID: ${{ fromJSON(inputs.row_json).artifact_id }}
          ARCH: ${{ fromJSON(inputs.row_json).arch }}
          BACKEND: ${{ fromJSON(inputs.row_json).backend }}
          BACKEND_VERSION: ${{ fromJSON(inputs.row_json).backend_version }}
          CONTEXT_BYTES: ${{ steps.stage_measurement.outputs.context_bytes }}
          DEPOT_BUILD_ID: ${{ steps.stage.outputs.build-id }}
          DEPOT_PROJECT_OUTPUT: ${{ steps.stage.outputs.project-id }}
          DISTRO: ${{ fromJSON(inputs.row_json).distro }}
          PLATFORM: ${{ fromJSON(inputs.row_json).platform }}
          RUNNER_LABELS_JSON: >-
            ${{ toJSON(
              vars.DEPOT_REGISTRY_CACHE_ENABLED == 'true'
              && github.repository == 'Mesh-LLM/mesh-packaging'
              && github.ref == 'refs/heads/main'
              && github.workflow_ref == 'Mesh-LLM/mesh-packaging/.github/workflows/images-release.yml@refs/heads/main'
              && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
              && (
              fromJSON(inputs.row_json).arch == 'arm64'
              && 'depot-ubuntu-24.04-arm'
              || 'depot-ubuntu-24.04'
              )
              || fromJSON(fromJSON(inputs.row_json).runner_labels)
            ) }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          START_AT: ${{ steps.stage_measurement.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          end_at="$(date +%s)"
          if [[ "$START_AT" =~ ^[0-9]+$ ]]; then
            action_seconds_json="$((end_at - START_AT))"
          else
            action_seconds_json=null
          fi
          if [[ "$CONTEXT_BYTES" =~ ^[0-9]+$ ]]; then
            context_bytes_json="$CONTEXT_BYTES"
          else
            context_bytes_json=null
          fi
          project_id="${DEPOT_PROJECT_OUTPUT:-$DEPOT_PROJECT_ID}"
          mkdir -p artifacts/depot-build
          jq -n \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg phase runtime-image-stage \
            --arg platform "$PLATFORM" \
            --arg arch "$ARCH" \
            --arg distro "$DISTRO" \
            --arg backend "$BACKEND" \
            --arg backend_version "$BACKEND_VERSION" \
            --arg runner_name "$ACTUAL_RUNNER_NAME" --arg runner_environment "$RUNNER_ENVIRONMENT" \
            --argjson runner_labels "$RUNNER_LABELS_JSON" \
            --arg project_id "$project_id" \
            --arg build_id "$DEPOT_BUILD_ID" \
            --argjson action_seconds "$action_seconds_json" \
            --argjson context_bytes_estimate "$context_bytes_json" \
            '{
              schema_version: 1,
              artifact_id: $artifact_id,
              phase: $phase,
              matrix: {
                platform: $platform,
                arch: $arch,
                distro: $distro,
                backend: $backend,
                backend_version: $backend_version
              },
              runner: {labels: $runner_labels, name: $runner_name, environment: $runner_environment},
              depot: {
                project_id: (if $project_id == "" then null else $project_id end),
                build_id: (if $build_id == "" then null else $build_id end)
              },
              measurements: {
                action_seconds: $action_seconds,
                context_bytes_estimate: $context_bytes_estimate,
                cache_state: "unclassified",
                cache_hit_rate: null,
                context_upload_seconds: null,
                cache_import_seconds: null,
                cache_export_seconds: null,
                cpu_utilization_percent: null,
                cost_usd: null
              }
            }' > "artifacts/depot-build/${ARTIFACT_ID}-runtime-image-stage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: depot-build-${{ fromJSON(inputs.row_json).artifact_id }}-runtime-image-stage
          path: artifacts/depot-build/${{ fromJSON(inputs.row_json).artifact_id }}-runtime-image-stage.json
          if-no-files-found: error
          retention-days: 14
      - name: Pull and test the exact staged digest
        env:
          IMAGE_REF: ${{ inputs.image_name }}@${{ steps.stage.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ steps.stage.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform "${{ fromJSON(inputs.row_json).platform }}" "$IMAGE_REF"
          docker run --rm --platform "${{ fromJSON(inputs.row_json).platform }}" --entrypoint sh \
            -v "$GITHUB_WORKSPACE/docker/qa-runtime-image.sh:/tmp/qa-runtime-image.sh:ro" \
            "$IMAGE_REF" /tmp/qa-runtime-image.sh \
            "${{ fromJSON(inputs.row_json).distro }}" \
            "${{ fromJSON(inputs.row_json).backend }}" \
            "${{ fromJSON(inputs.row_json).mesh_version }}"
          docker run --rm --platform "${{ fromJSON(inputs.row_json).platform }}" --entrypoint sh \
            -v "$GITHUB_WORKSPACE/scripts/client-readiness-smoke.sh:/tmp/client-readiness-smoke.sh:ro" \
            "$IMAGE_REF" -c \
            'MESH_LLM_SMOKE_BIN=/usr/local/bin/mesh-llm-entrypoint sh /tmp/client-readiness-smoke.sh'
      - name: Record exact package, product, base, image, and QA evidence
        env:
          ARTIFACT_ID: ${{ fromJSON(inputs.row_json).artifact_id }}
          PLATFORM: ${{ fromJSON(inputs.row_json).platform }}
          ARCH: ${{ fromJSON(inputs.row_json).arch }}
          BACKEND: ${{ fromJSON(inputs.row_json).backend }}
          BACKEND_VERSION: ${{ fromJSON(inputs.row_json).backend_version }}
          PACKAGE_FILE: ${{ fromJSON(inputs.row_json).package_file }}
          PACKAGE_BASE_IMAGE: ${{ needs.package.outputs.package_base_image }}
          RUNTIME_BASE_IMAGE: ${{ needs.package.outputs.runtime_base_image }}
          PACKAGE_BASE_SOURCE: ${{ needs.package.outputs.package_base_source }}
          RUNTIME_BASE_SOURCE: ${{ needs.package.outputs.runtime_base_source }}
          TAGS: ${{ fromJSON(inputs.row_json).tags }}
          VERSION: ${{ fromJSON(inputs.row_json).mesh_version }}
          MESH_REF: ${{ inputs.mesh_ref }}
          MESH_SHA: ${{ inputs.mesh_sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_DIGEST: ${{ steps.stage.outputs.digest }}
          HOST_SHA: ${{ steps.product.outputs.host_sha }}
          RUNTIME_ID: ${{ steps.product.outputs.runtime_id }}
          RUNTIME_SHA: ${{ steps.product.outputs.runtime_sha }}
        shell: bash
        run: |
          set -euo pipefail
          package_sha="$(sha256sum "artifacts/native-package/$PACKAGE_FILE" | awk '{ print $1 }')"
          jq -n \
            --arg version "$VERSION" --arg mesh_ref "$MESH_REF" \
            --arg mesh_sha "$MESH_SHA" --arg packaging_sha "$GITHUB_SHA" \
            --arg artifact_id "$ARTIFACT_ID" --arg platform "$PLATFORM" --arg arch "$ARCH" \
            --arg backend "$BACKEND" --arg backend_version "$BACKEND_VERSION" \
            --arg package_file "$PACKAGE_FILE" --arg package_sha "$package_sha" \
            --arg package_base_image "$PACKAGE_BASE_IMAGE" \
            --arg runtime_base_image "$RUNTIME_BASE_IMAGE" --arg tags "$TAGS" \
            --arg host_sha "$HOST_SHA" --arg runtime_id "$RUNTIME_ID" \
            --arg runtime_sha "$RUNTIME_SHA" --arg image_name "$IMAGE_NAME" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{
              schema_version:1,
              plan_identity:{version:$version,mesh_ref:$mesh_ref,mesh_sha:$mesh_sha,packaging_sha:$packaging_sha},
              artifact_id:$artifact_id,platform:$platform,arch:$arch,backend:$backend,
              backend_version:$backend_version,package_file:$package_file,
              package_base_image:$package_base_image,
              runtime_base_image:$runtime_base_image,tags:($tags | split("\n")),
              package:{name:$package_file,sha256:$package_sha},
              upstream:{mesh_ref:$mesh_ref,mesh_sha:$mesh_sha},
              product:{host_sha256:$host_sha,runtime_id:$runtime_id,runtime_sha256:$runtime_sha},
              base_image:{ref:$runtime_base_image},
              image:{name:$image_name,digest:$image_digest},
              qa:{passed:true,image_digest:$image_digest}
            }' > image-row-result.json
          jq -n --arg artifact_id "$ARTIFACT_ID" \
            --arg package_source "$PACKAGE_BASE_SOURCE" --arg package_pull "$PACKAGE_BASE_IMAGE" \
            --arg runtime_source "$RUNTIME_BASE_SOURCE" --arg runtime_pull "$RUNTIME_BASE_IMAGE" \
            '{artifact_id:$artifact_id,package:{source:$package_source,pull:$package_pull},runtime:{source:$runtime_source,pull:$runtime_pull}}' \
            > image-base-resolution.json
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ inputs.image_name }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mesh-llm-image-result-${{ fromJSON(inputs.row_json).artifact_id }}
          path: |
            image-row-result.json
            image-base-resolution.json
          if-no-files-found: error
          retention-days: 14
