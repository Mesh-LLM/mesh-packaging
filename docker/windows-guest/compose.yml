# A Windows Server 2025 guest with the mesh-llm build prerequisites, for a
# persistent self-hosted Windows runner. See README.md in this directory.
#
#   GUEST_PASSWORD=... docker compose up -d
#
# The host needs KVM (/dev/kvm). The first start downloads the evaluation ISO
# from Microsoft, installs Windows unattended, then runs oem/provision.ps1 once.
services:
  mesh-windows-guest:
    # dockur/windows v6.06, pinned by digest.
    image: dockurr/windows@sha256:16fd7c39a3e48bb946d29c59dc6015942e5b900a1fa5d7e5552053bfc48ee2ea
    container_name: mesh-windows-guest
    environment:
      VERSION: "2025"
      RAM_SIZE: "${GUEST_RAM_SIZE:-16G}"
      CPU_CORES: "${GUEST_CPU_CORES:-8}"
      DISK_SIZE: "${GUEST_DISK_SIZE:-256G}"
      USERNAME: "${GUEST_USERNAME:-mesh}"
      PASSWORD: "${GUEST_PASSWORD:?set GUEST_PASSWORD for the guest administrator}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      # Web console, RDP and SSH stay on the host's loopback; tunnel to reach them.
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:3389:3389"
      - "127.0.0.1:2222:22"
    volumes:
      - ./storage:/storage
      - ./oem:/oem
    restart: unless-stopped
    stop_grace_period: 2m
